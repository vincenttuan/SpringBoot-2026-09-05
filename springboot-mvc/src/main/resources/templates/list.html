<!DOCTYPE html>
<!-- xmlns:th 宣告 Thymeleaf 的 th 屬性 -->
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Thymeleaf Book</title>
	</head>
	<body>
		<!-- 書籍新增 -->
		<form method="post" th:action="@{/ssr/book}">
			書名: <input type="text" name="name" required><p />
			價格: <input type="number" name="price" required><p />
			數量: <input type="number" name="amount" required><p />
			出刊: <input type="checkbox" name="pub"><p />
			
			<button type="submit">新增書籍</button>
		</form>
		
		<!-- 書籍列表 -->
		<div>
			<table border="1">
				<thead>
					<tr>
						<th>序號</th>
						<th>書名</th>
						<th>價格</th>
						<th>數量</th>
						<th>出刊</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="book : ${books}">
						<td th:text="${book.id}">id</td>
						<td th:text="${book.name}">name</td>
						<td th:text="${book.price}">price</td>
						<td th:text="${book.amount}">amount</td>
						<td th:text="${book.pub}">pub</td>
						<td></td>
					</tr>
				</tbody>
			</table>
		</div>
		
	</body>
</html>
