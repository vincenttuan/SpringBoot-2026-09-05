<!DOCTYPE html>
<!-- xmlns:th 宣告 Thymeleaf 的 th 屬性 -->
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Stock Form</title>
	</head>
	<body>
		<div>
			<fieldset>
				<legend>Stock 功能</legend>
				<p>
					<a th:href="@{/stock}" th:title="@{/stock}">回股票列表</a>
				</p>
			</fieldset>
		</div> 
		<form method="post" th:object="${stockForm}" th:action="@{/stock}">
			<fieldset>
				<legend>Stock 表單 (<span th:text="${id == null}?'新增':'編輯'"></span>股票)</legend>
				股票代號: <input th:field="*{symbol}"><p />
				股票名稱: <input th:field="*{name}"><p />
				股票價格: <input th:field="*{price}"><p />
				<button type="submit">傳送</button>
			</fieldset>
		</form> 
		
	</body>
</html>
