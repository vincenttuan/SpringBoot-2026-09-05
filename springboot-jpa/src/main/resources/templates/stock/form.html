<!DOCTYPE html>
<!-- xmlns:th 宣告 Thymeleaf 的 th 屬性 -->
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Stock Form</title>
	</head>
	<body>
		<form method="post" th:object="${stockForm}" th:action="@{/stock}">
			<fieldset>
				<legend>Stock 表單 (新增股票)</legend>
				股票代號: <input th:field="*{symbol}"><p />
				股票名稱: <input th:field="*{name}"><p />
				股票價格: <input th:field="*{price}"><p />
				<button type="submit">傳送</button>
				<a th:href="@{/stock}">回清單</a>
			</fieldset>
		</form> 
		
	</body>
</html>
