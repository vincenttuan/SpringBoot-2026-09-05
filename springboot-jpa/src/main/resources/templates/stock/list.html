<!DOCTYPE html>
<!-- xmlns:th 宣告 Thymeleaf 的 th 屬性 -->
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Stock List</title>
	</head>
	<body>
		<!-- 
		<p th:text="${stocks}"></p>
		 -->
		<div>
			<fieldset>
				<legend>Stock 功能</legend>
				<p>
					<a th:href="@{/stock/new}" th:title="@{/stock/new}">新增股票</a>
				</p>
			</fieldset>
		</div> 
		<div>
			<fieldset>
				<legend>Stock List</legend>
				
				<table border="1" width="100%">
					<thead>
						<tr>
							<th>序號 (id)</th>
							<th>股票代號 (symbol)</th>
							<th>股票名稱 (name)</th>
							<th>股票價格 (price)</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="stock : ${stocks}">
							<td th:text="${stock.id}"></td>
							<td th:text="${stock.symbol}"></td>
							<td th:text="${stock.name}"></td>
							<td th:text="${stock.price}"></td>
							<td>
								
								<button>編輯</button>
								
								<button>刪除</button>
								
							</td>
							
						</tr>
					</tbody>
				</table>
				
			</fieldset>
		</div>
	</body>
</html>
