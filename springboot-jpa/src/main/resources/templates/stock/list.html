<!DOCTYPE html>
<!-- xmlns:th 宣告 Thymeleaf 的 th 屬性 -->
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Stock List</title>
	</head>
	<body>
		<!-- 
		<p th:text="${stocks}"></p>
		 -->
		<div>
			<fieldset>
				<legend>Stock 功能</legend>
				<p>
					<a th:href="@{/stock/new}" th:title="@{/stock/new}">新增股票</a>
				</p>
			</fieldset>
		</div> 
		
		<!-- 分頁功能 -->
		<div>
			<fieldset>
				<!-- 顯示總筆數 -->
				共 <span th:text="${stockPage.totalElements}"></span> 筆
				｜
				第 <span th:text="${stockPage.number + 1}"></span> 頁
				｜
				共 <span th:text="${stockPage.totalPages}"></span> 頁
				｜
				<!-- 上一頁 -->
				<a th:if="${stockPage.hasPrevious()}"
				   th:href="@{/stock(
								page=${stockPage.number},
								size=${stockPage.size},
								sort=${sort},
								dir=${dir}
							)}">上一頁</a>
				｜
				<!-- 下一頁 -->
				<a th:if="${stockPage.hasNext()}"
				   th:href="@{/stock(
								page=${stockPage.number + 2},
								size=${stockPage.size},
								sort=${sort},
								dir=${dir}
							)}">下一頁</a>
			</fieldset>
		</div>
		
		
		<div>
			<fieldset>
				<legend>Stock List</legend>
				
				<table border="1" width="100%">
					<thead>
						<tr>
							<th>序號 (id)</th>
							<th>股票代號 (symbol)</th>
							<th>股票名稱 (name)</th>
							<th>
								<a th:href="@{/stock(sort='price', dir='asc')}">▲</a> 
								股票價格 (price) 
								<a th:href="@{/stock(sort='price', dir='desc')}">▼</a>
							</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="stock : ${stocks}">
							<td th:text="${stock.id}"></td>
							<td th:text="${stock.symbol}"></td>
							<td th:text="${stock.name}"></td>
							<td th:text="${stock.price}"></td>
							<td align="center">
								
								<form method="get" th:action="@{/stock/{id}(id=${stock.id})}">
									<button th:title="@{/stock/{id}(id=${stock.id})}">編輯</button>
								</form>
								
								<form method="post" th:action="@{/stock/{id}(id=${stock.id})}">
									<input type="hidden" name="_method" value="DELETE">
									<button th:title="@{/stock/{id}(id=${stock.id})}">刪除</button>
								</form>
							</td>
							
						</tr>
					</tbody>
				</table>
				
			</fieldset>
		</div>
	</body>
</html>
